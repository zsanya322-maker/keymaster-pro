name: v0.3.1 Macro Playback Model

on:
  push:
    branches:
      - dev/v0.3.1-mouse-macros
    paths:
      - '.github/workflows/v031-macro-model.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
      - name: Adapt staging script to current ActionEditor
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/v031_macro_model.py')
          s = p.read_text(encoding='utf-8')
          old = '''    "    case 'runMacro': return { type, steps: [] };\\n",\n    "    case 'runMacro': return { type, steps: [], playback: { speed: 1, repeatCount: 1, repeatWhileHeld: false } };\\n",\n'''
          new = '''    "      onChange({ type, steps: [] });\\n",\n    "      onChange({ type, steps: [], playback: { speed: 1, repeatCount: 1, repeatWhileHeld: false } });\\n",\n'''
          if old not in s:
              raise SystemExit('staging ActionEditor marker block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - run: python scripts/v031_macro_model.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/types.ts src-tauri/src/schemas/frontend.rs src-tauri/src/schemas/engine.rs src-tauri/src/daemon/compiler.rs src-tauri/src/shared/persistence.rs src/pages/RulesPage.tsx src/components/ruleBuilder/ActionEditor.tsx src-tauri/src/daemon/router.rs
          git commit -m 'feat(0.3.1): add macro playback model and schema v3 migration'
          git push origin HEAD:dev/v0.3.1-mouse-macros
