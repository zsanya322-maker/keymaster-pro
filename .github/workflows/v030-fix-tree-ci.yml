name: v0.3.0 Tree CI Cleanup

on:
  push:
    branches:
      - dev/v0.3.0-rule-model-v2
    paths:
      - '.github/workflows/v030-fix-tree-ci.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.0-rule-model-v2
      - name: Remove obsolete helper
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/RulesPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''function formatRuleSummary(rule: FrontendRule, t: TFunction): string {\n  const firstAction = rule.actions[0];\n  if (!firstAction) return '—';\n  const first = formatActionLabel(firstAction, t);\n  return rule.actions.length > 1 ? `${first}  +${rule.actions.length - 1}` : first;\n}\n\n'''
          if old not in s:
              raise SystemExit('obsolete helper not found')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/RulesPage.tsx
          git commit -m 'fix(0.3.0): remove obsolete rule summary helper'
          git push origin HEAD:dev/v0.3.0-rule-model-v2
