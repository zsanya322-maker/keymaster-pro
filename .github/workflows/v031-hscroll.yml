name: v0.3.1 Horizontal Macro Scroll

on:
  push:
    branches:
      - dev/v0.3.1-mouse-macros
    paths:
      - '.github/workflows/v031-hscroll.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
      - run: python scripts/v031_hscroll.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/types.ts src-tauri/src/schemas/frontend.rs src-tauri/src/schemas/engine.rs src-tauri/src/daemon/compiler.rs src-tauri/src/daemon/hooks.rs src-tauri/src/simulator/mod.rs src/components/ruleBuilder/MacroEditor.tsx
          git commit -m 'fix(0.3.1): preserve horizontal wheel in macros'
          git push origin HEAD:dev/v0.3.1-mouse-macros
