name: v0.3.1 Finalize

on:
  push:
    branches: [dev/v0.3.1-mouse-macros]
    paths:
      - scripts/v031_macro_final.py
      - .github/workflows/v031-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - run: python scripts/v031_prebuild_fix.py
        name: Fix exhaustive mouse trigger UI
      - run: python scripts/v031_macro_final.py
        name: Apply final 0.3.1 patch
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Frontend build
      - run: cargo check --all-targets
        working-directory: src-tauri
        name: Rust check
      - run: cargo test
        working-directory: src-tauri
        name: Rust tests
      - name: Commit validated 0.3.1
        shell: pwsh
        run: |
          Remove-Item scripts/v031_macro_final.py -Force
          if (Test-Path scripts/v031_prebuild_fix.py) { Remove-Item scripts/v031_prebuild_fix.py -Force }
          Remove-Item .github/workflows/v031-finalize.yml -Force
          if (Test-Path .github/workflows/v031-macro-controls.yml) { Remove-Item .github/workflows/v031-macro-controls.yml -Force }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(0.3.1): complete mouse triggers and macro playback controls"
          git push origin HEAD:dev/v0.3.1-mouse-macros
