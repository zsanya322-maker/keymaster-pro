name: v0.3.1 Compiler Fix

on:
  push:
    branches:
      - dev/v0.3.1-mouse-macros
    paths:
      - '.github/workflows/v031-fix-compiler.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
      - run: python scripts/v031_mouse_move_compile_fix.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/daemon/compiler.rs
          git commit -m 'fix(0.3.1): compile macro actions in mouse-move rules'
          git push origin HEAD:dev/v0.3.1-mouse-macros
