name: Hardening Refresh

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: hardening-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ai-mcp-hub'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply hardening source patches
        shell: pwsh
        run: |
          @'
          import json
          import re
          from pathlib import Path

          path = Path('src-tauri/src/daemon/ipc.rs')
          text = path.read_text(encoding='utf-8')
          marker = 'use super::ipc_types::*;\n'
          insert = '''use super::ipc_types::*;\n\n// Profile mutations arrive over independent Named Pipe connections and may be\n// processed concurrently. Serialize only mutation requests so read/status IPC\n// remains concurrent while read-modify-write operations are atomic relative to\n// every existing GUI/profile mutation.\nstatic PROFILE_MUTATION_LOCK: tokio::sync::Mutex<()> = tokio::sync::Mutex::const_new(());\n\nfn serializes_profile_mutation(method: &str) -> bool {\n    method.starts_with("automation.")\n        || (method.starts_with("profile.")\n            && !matches!(\n                method,\n                "profile.list" | "profile.runtime_status" | "profile.backups"\n            ))\n        || matches!(method, "set_active_profile" | "apply_onboarding_example")\n}\n'''
          if 'static PROFILE_MUTATION_LOCK' not in text:
              text = text.replace(marker, insert, 1)

          guard = '''                    let mutation_guard = if serializes_profile_mutation(&req.method) {\n                        Some(PROFILE_MUTATION_LOCK.lock().await)\n                    } else {\n                        None\n                    };\n'''
          drop_line = '                    drop(mutation_guard);\n'
          while guard + guard in text:
              text = text.replace(guard + guard, guard)
          while drop_line + drop_line in text:
              text = text.replace(drop_line + drop_line, drop_line)
          response_line = '                    let response = route_request(req, &state).await;\n'
          if guard not in text:
              text = text.replace(response_line, guard + response_line + drop_line, 1)

          marker2 = '        // === Canonical router ===\n'
          automation = '''        // === Automation write/validation boundary ===\n        method if method.starts_with("automation.") => {\n            match crate::daemon::automation::dispatch(method, req.params, state).await {\n                Ok(value) => Ok(value),\n                Err(message) => {\n                    warn!("Automation IPC error for {}: {}", method, message);\n                    Err(JsonRpcError {\n                        code: INTERNAL_ERROR,\n                        message,\n                        data: None,\n                    })\n                }\n            }\n        }\n\n'''
          if 'Automation write/validation boundary' not in text:
              text = text.replace(marker2, automation + marker2, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src-tauri/src/mcp.rs')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'\nfn normalize_rule_value\(.*?\nasync fn list_profiles_tool\(',
              '\nasync fn list_profiles_tool(',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace(
              'json!({ "rule": { "type": "object" } }),\n            &["rule"],',
              'json!({ "rule": { "type": "object" }, "profileId": { "type": "string" } }),\n            &["rule"],',
              1,
          )
          text = re.sub(
              r'async fn validate_rule_tool\(args: &Map<String, Value>\) -> Result<Value, String> \{.*?\n\}\n\nasync fn activate_profile_tool',
              '''async fn validate_rule_tool(args: &Map<String, Value>) -> Result<Value, String> {\n    let rule = args\n        .get("rule")\n        .cloned()\n        .ok_or_else(|| "Missing rule".to_string())?;\n    let mut params = json!({ "rule": rule });\n    if let Some(profile_id) = args.get("profileId").and_then(Value::as_str) {\n        params["profileId"] = json!(profile_id);\n    }\n    crate::daemon::ipc_client::call("automation.validate_rule", Some(params)).await\n}\n\nasync fn activate_profile_tool''',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'async fn apply_rule_tool\(args: &Map<String, Value>\) -> Result<Value, String> \{.*?\n\}\n\nasync fn call_tool',
              '''async fn apply_rule_tool(args: &Map<String, Value>) -> Result<Value, String> {\n    let rule = args\n        .get("rule")\n        .cloned()\n        .ok_or_else(|| "Missing rule".to_string())?;\n    let mut params = json!({ "rule": rule });\n    if let Some(profile_id) = args.get("profileId").and_then(Value::as_str) {\n        params["profileId"] = json!(profile_id);\n    }\n    crate::daemon::ipc_client::call("automation.append_rule", Some(params)).await\n}\n\nasync fn call_tool''',
              text,
              count=1,
              flags=re.S,
          )
          path.write_text(text, encoding='utf-8')

          for locale, labels in [
              ('ru', {'read': 'READ', 'write': 'WRITE', 'exec': 'EXEC'}),
              ('en', {'read': 'READ', 'write': 'WRITE', 'exec': 'EXEC'}),
          ]:
              path = Path(f'src/i18n/locales/automation.{locale}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              data['mcp']['access'] = labels
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          '@ | python -
      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit generated and patched files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml src-tauri/src/daemon/ipc.rs src-tauri/src/daemon/automation.rs src-tauri/src/daemon/mod.rs src-tauri/src/mcp.rs src/i18n/locales/automation.ru.json src/i18n/locales/automation.en.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "build: refresh hardening generated files"
          git fetch origin agent/ai-mcp-hub
          git rebase origin/agent/ai-mcp-hub
          git push origin HEAD:agent/ai-mcp-hub
