name: v0.3.1 Mouse Runtime Integration

on:
  push:
    branches:
      - dev/v0.3.1-mouse-macros
    paths:
      - '.github/workflows/v031-mouse-runtime.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
      - name: Apply staged runtime patch
        run: python scripts/v031_mouse_runtime.py
      - name: Commit runtime integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/daemon/compiler.rs src-tauri/src/daemon/engine.rs src-tauri/src/daemon/hooks.rs
          git commit -m 'feat(0.3.1): wire typed mouse triggers into runtime'
          git push origin HEAD:dev/v0.3.1-mouse-macros
