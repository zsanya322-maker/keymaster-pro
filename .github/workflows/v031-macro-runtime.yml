name: v0.3.1 Cancellable Macro Runtime

on:
  push:
    branches:
      - dev/v0.3.1-mouse-macros
    paths:
      - '.github/workflows/v031-macro-runtime.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
      - run: python scripts/v031_macro_runtime.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/simulator/mod.rs src-tauri/src/daemon/engine.rs
          git commit -m 'feat(0.3.1): wire cancellable macro job runtime'
          git push origin HEAD:dev/v0.3.1-mouse-macros
