name: AI Provider Rust Secret Once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'agent/ai-provider-profiles-hotfix'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-provider-profiles-hotfix
          fetch-depth: 0
      - name: Keep saved API key inside Rust
        shell: pwsh
        run: |
          $path = 'src/pages/AutomationLabPage.tsx'
          $text = Get-Content $path -Raw
          $text = $text.Replace("import { requestAutomationDraft } from '../lib/aiComposer'", "import { requestAutomationDraftFromSavedProvider } from '../lib/aiComposer'")
          $old = @'
          if (!activeProvider) automationError('ai_provider_missing')
          const apiKey = (await invoke<string | null>('ai_secret_get', { providerId: activeProvider.id })) ?? ''
          const nextDraft = await requestAutomationDraft(
            { endpoint: activeProvider.endpoint, model: activeProvider.model, apiKey },
            activeProfile,
            prompt,
          )
'@
          $new = @'
          if (!activeProvider) automationError('ai_provider_missing')
          const nextDraft = await requestAutomationDraftFromSavedProvider(
            activeProvider.id,
            activeProfile,
            prompt,
          )
'@
          if (-not $text.Contains($old.TrimStart("`r", "`n"))) {
            throw 'AutomationLab provider request anchor not found'
          }
          $text = $text.Replace($old.TrimStart("`r", "`n"), $new.TrimStart("`r", "`n"))
          Set-Content -Path $path -Value $text -Encoding utf8
      - name: Validate frontend boundary
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AutomationLabPage.tsx
          git commit -m "security: keep saved AI key inside Rust"
          git fetch origin agent/ai-provider-profiles-hotfix
          git rebase origin/agent/ai-provider-profiles-hotfix
          git push origin HEAD:agent/ai-provider-profiles-hotfix
