name: Publish v0.2.1

on:
  push:
    branches:
      - 'dev/v0.3-ui-stability'
    paths:
      - '.github/workflows/publish-v0.2.1.yml'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and publish updater release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v0.2.1
          releaseName: 'KeyMaster Pro v0.2.1'
          releaseBody: |
            KeyMaster Pro v0.2.1 — Classic UI / stability update.

            Public updater release built from dev/v0.3-ui-stability checkpoint 8.
            Includes the redesigned compact interface and the accumulated persistence,
            daemon lifecycle, IPC, profile-safety and Windows stability fixes.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
