name: v0.3.0 Edge Fix Run

on:
  push:
    branches:
      - dev/v0.3.0-rule-model-v2

permissions:
  contents: write

concurrency:
  group: v030-edge-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v030-edge-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply trigger-edge fix
        run: python scripts/v030_edge_fix.py
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/daemon/engine.rs
          git commit -m "feat(0.3.0): execute trigger edges correctly [v030-edge-applied]"
          git push origin HEAD:dev/v0.3.0-rule-model-v2
