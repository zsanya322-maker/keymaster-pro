name: v0.3.3 Complete

on:
  push:
    branches:
      - dev/v0.3.3-text-expansion
    paths:
      - .github/workflows/v033-complete.yml
      - scripts/v033_bootstrap.py
      - scripts/v033_schema.py
      - scripts/v033_runtime.py
      - scripts/v033_ui.py
      - scripts/v033_frontend_fix.py
      - scripts/v033_audit.py

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  complete:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/v0.3.3-text-expansion
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Apply v0.3.3 implementation
        run: |
          python scripts/v033_bootstrap.py
          python scripts/v033_schema.py
          python scripts/v033_runtime.py
          python scripts/v033_ui.py
          python scripts/v033_frontend_fix.py
          python scripts/v033_audit.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm build

      - name: Rust check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Build unsigned dev NSIS
        shell: pwsh
        run: |
          $config = "src-tauri/tauri.conf.json"
          $json = Get-Content $config -Raw | ConvertFrom-Json
          $original = $json.bundle.createUpdaterArtifacts
          $json.bundle.createUpdaterArtifacts = $false
          $json | ConvertTo-Json -Depth 100 | Set-Content $config -Encoding utf8
          try {
            pnpm tauri build --bundles nsis
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            $json.bundle.createUpdaterArtifacts = $original
            $json | ConvertTo-Json -Depth 100 | Set-Content $config -Encoding utf8
          }

      - name: Commit validated v0.3.3
        shell: pwsh
        run: |
          git config user.name "AlexB322"
          git config user.email "264132173+zsanya322-maker@users.noreply.github.com"
          git rm -f scripts/v033_bootstrap.py scripts/v033_schema.py scripts/v033_runtime.py scripts/v033_ui.py scripts/v033_frontend_fix.py scripts/v033_audit.py
          git rm -f .github/workflows/v033-complete.yml
          if (Test-Path scripts/v032_frontend_fix.py) { git rm -f scripts/v032_frontend_fix.py }
          if (Test-Path scripts/v032_profiles_context.py) { git rm -f scripts/v032_profiles_context.py }
          if (Test-Path scripts/v032_rust_fix.py) { git rm -f scripts/v032_rust_fix.py }
          if (Test-Path .github/workflows/v031-package-current.yml) { git rm -f .github/workflows/v031-package-current.yml }
          git add -A
          git commit -m "feat(0.3.3): complete text expansion templates and undo"
          git push origin HEAD:dev/v0.3.3-text-expansion

      - name: Upload v0.3.3 NSIS
        uses: actions/upload-artifact@v4
        with:
          name: KeyMaster-Pro-v0.3.3-Windows
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
