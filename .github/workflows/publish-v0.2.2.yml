name: Publish v0.2.2

on:
  push:
    branches:
      - dev/v0.3-ui-stability
    paths:
      - '.github/workflows/publish-v0.2.2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout verified release candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish v0.2.2
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v0.2.2
          releaseName: 'KeyMaster Pro v0.2.2'
          releaseBody: |
            KeyMaster Pro v0.2.2

            - второй проход по классическому интерфейсу;
            - компактнее список правил, toolbar, sidebar и status bar;
            - переработан редактор правила без лишних вложенных рамок;
            - убран второй поиск и технические подписи TypeText/KeyDown/VK из обычного UI;
            - нормализована русская локализация и миграция языка старых конфигов;
            - включает исправления lifecycle, persistence и profile safety из v0.2.1 dev-ветки.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
