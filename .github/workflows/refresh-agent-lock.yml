name: Refresh Agent Cargo Lock

on:
  push:
    branches:
      - agent/ai-mcp-hub
    paths:
      - .github/workflows/refresh-agent-lock.yml
      - src-tauri/Cargo.toml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-mcp-hub
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh Cargo.lock
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Commit lockfile if changed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cargo.lock already current"
            exit 0
          }
          git commit -m "build: refresh Cargo.lock"
          git push origin HEAD:agent/ai-mcp-hub
