name: v0.3.1 Current Head

on:
  push:
    branches: [dev/v0.3.1-mouse-macros]
    paths:
      - scripts/v031_compile_fix.py
      - .github/workflows/v031-current-head.yml

permissions:
  contents: write

concurrency:
  group: v031-current-head
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Apply macro playback implementation
        run: python scripts/v031_macro_final.py
      - name: Apply compile and live-config fixes
        run: python scripts/v031_compile_fix.py
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend build
        run: pnpm build
      - name: Rust check
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Commit validated v0.3.1
        shell: pwsh
        run: |
          Remove-Item scripts/v031_macro_final.py -Force
          Remove-Item scripts/v031_compile_fix.py -Force
          Remove-Item .github/workflows/v031-current-head.yml -Force
          if (Test-Path .github/workflows/v031-finalize.yml) { Remove-Item .github/workflows/v031-finalize.yml -Force }
          if (Test-Path .github/workflows/v031-macro-controls.yml) { Remove-Item .github/workflows/v031-macro-controls.yml -Force }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(0.3.1): complete mouse triggers and macro playback controls"
          git pull --rebase origin dev/v0.3.1-mouse-macros
          git push origin HEAD:dev/v0.3.1-mouse-macros
