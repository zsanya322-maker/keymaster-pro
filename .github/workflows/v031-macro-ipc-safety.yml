name: v0.3.1 Macro IPC Safety

on:
  push:
    branches:
      - dev/v0.3.1-mouse-macros
    paths:
      - '.github/workflows/v031-macro-ipc-safety.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
      - run: python scripts/v031_macro_ipc_safety.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/types.ts src-tauri/src/shared/types.rs src-tauri/src/daemon/state.rs src-tauri/src/daemon/runner.rs src-tauri/src/daemon/hooks.rs src-tauri/src/daemon/router.rs
          git commit -m 'feat(0.3.1): add macro preview stop and emergency safety'
          git push origin HEAD:dev/v0.3.1-mouse-macros
