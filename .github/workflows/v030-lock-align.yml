name: v0.3.0 Cargo Lock Align

on:
  push:
    branches:
      - dev/v0.3.0-rule-model-v2
    paths:
      - '.github/workflows/v030-lock-align.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.0-rule-model-v2
      - name: Align root package version in Cargo.lock
        shell: python
        run: |
          from pathlib import Path
          p = Path('src-tauri/Cargo.lock')
          s = p.read_text(encoding='utf-8')
          old = 'name = "keymaster-pro"\nversion = "0.2.0"'
          new = 'name = "keymaster-pro"\nversion = "0.3.0"'
          if old not in s:
              raise SystemExit('expected stale root package version not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit lock alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          git commit -m 'chore(0.3.0): align Cargo lock version'
          git push origin HEAD:dev/v0.3.0-rule-model-v2
