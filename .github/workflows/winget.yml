name: Publish to WinGet

# Автоматически открывает PR в microsoft/winget-pkgs ПОСЛЕ успешной сборки релиза.
#
# ВАЖНО про триггер: release.yml создаёт GitHub Release через GITHUB_TOKEN,
# а GitHub по соображениям безопасности НЕ пробрасывает события от GITHUB_TOKEN
# в другие workflows. Поэтому мы используем `workflow_run` — он срабатывает сам,
# когда release.yml завершается успешно, независимо от того, кто его инициировал.
#
# Под капотом vedantmgoyal9/winget-releaser использует Komac:
#   - скачивает .exe из свежего релиза и считает SHA256
#   - обновляет версию, InstallerUrl и InstallerSha256 в winget-pkgs
#   - копирует метаданные (Publisher, PackageName) из предыдущей версии
#   - открывает PR в microsoft/winget-pkgs
#
# Требуется секрет WINGET_TOKEN — classic PAT со scope `public_repo`.
# Создать: GitHub → Settings → Developer settings → Personal access tokens (classic)
#          → scope: public_repo → Repo → Settings → Secrets and variables → Actions

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  publish:
    # Запускаемся только при успешном завершении Release (не при отмене/провале)
    # и только если Release был запущен тегом v* (а не обычным пушем в main).
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: windows-latest
    steps:
      - name: Find the published release version
        id: release
        shell: bash
        run: |
          # head_branch для тега приходит как "refs/tags/v0.2.0" или "v0.2.0"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          TAG="${BRANCH##*/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Will publish release $TAG to WinGet"

      - name: Publish to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: KeyMasterPro.KeyMasterPro
          release-tag: ${{ steps.release.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
          # Только NSIS-инсталлер (.exe), игнорируем .msi и .sig
          installers-regex: '\.exe$'
