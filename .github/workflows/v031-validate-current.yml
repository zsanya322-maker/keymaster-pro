name: v0.3.1 Validate Current Product

on:
  push:
    branches: [dev/v0.3.1-mouse-macros]
    paths:
      - .github/workflows/v031-validate-current.yml

permissions:
  contents: write

concurrency:
  group: v031-validate-current
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Align v0.3.1 metadata
        shell: pwsh
        run: |
          $p='package.json'; $s=Get-Content $p -Raw; Set-Content $p ($s.Replace('"version": "0.3.0"','"version": "0.3.1"')) -NoNewline
          $p='src-tauri/Cargo.toml'; $s=Get-Content $p -Raw; Set-Content $p ($s.Replace('version = "0.3.0"','version = "0.3.1"')) -NoNewline
          $p='src-tauri/tauri.conf.json'; $s=Get-Content $p -Raw; Set-Content $p ($s.Replace('"version": "0.3.0"','"version": "0.3.1"')) -NoNewline
          $p='src/app/App.tsx'; $s=Get-Content $p -Raw; Set-Content $p ($s.Replace('const PROFILE_SCHEMA_VERSION = 1','const PROFILE_SCHEMA_VERSION = 3')) -NoNewline
      - run: pnpm install --frozen-lockfile
      - name: Frontend build
        run: pnpm build
      - name: Rust check
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Commit validated v0.3.1
        shell: pwsh
        run: |
          Get-ChildItem .github/workflows -Filter 'v031-*.yml' -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem scripts -Filter 'v031*.py' -ErrorAction SilentlyContinue | Remove-Item -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(0.3.1): finalize version metadata and cleanup staging"
          git pull --rebase origin dev/v0.3.1-mouse-macros
          git push origin HEAD:dev/v0.3.1-mouse-macros
