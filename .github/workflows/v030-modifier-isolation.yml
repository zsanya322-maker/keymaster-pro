name: v0.3.0 Modifier Isolation

on:
  push:
    branches:
      - dev/v0.3.0-rule-model-v2

permissions:
  contents: write

concurrency:
  group: v030-modifier-isolation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v030-modifier-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply modifier isolation
        run: python scripts/v030_modifier_isolation.py
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/daemon/engine.rs src-tauri/src/simulator/mod.rs
          git commit -m "feat(0.3.0): isolate source modifiers during output [v030-modifier-applied]"
          git push origin HEAD:dev/v0.3.0-rule-model-v2
