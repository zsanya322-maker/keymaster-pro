name: v0.3.0 Dynamic Modifier Restore

on:
  push:
    branches:
      - dev/v0.3.0-rule-model-v2

permissions:
  contents: write

concurrency:
  group: v030-dynamic-restore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v030-restore-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dynamic restore
        run: python scripts/v030_dynamic_restore.py
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/daemon/engine.rs
          git commit -m "fix(0.3.0): restore only physically held modifiers [v030-restore-applied]"
          git push origin HEAD:dev/v0.3.0-rule-model-v2
