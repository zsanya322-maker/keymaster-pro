name: v0.3.1 Macro Step DragDrop

on:
  push:
    branches:
      - dev/v0.3.1-mouse-macros
    paths:
      - '.github/workflows/v031-macro-dnd.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
      - run: python scripts/v031_macro_dnd.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ruleBuilder/MacroEditor.tsx
          git commit -m 'feat(0.3.1): add macro step drag and drop'
          git push origin HEAD:dev/v0.3.1-mouse-macros
