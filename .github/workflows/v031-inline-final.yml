name: v0.3.1 Inline Final

on:
  push:
    branches: [dev/v0.3.1-mouse-macros]
    paths:
      - .github/workflows/v031-inline-final.yml

permissions:
  contents: write

concurrency:
  group: v031-inline-final
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Apply final source fixes inline
        shell: pwsh
        run: |
          $p = 'src-tauri/src/daemon/compiler.rs'
          $s = Get-Content $p -Raw
          $old = '        actions: rule.actions.iter().map(compile_action).collect(),'
          $new = @'
                  actions: rule
                      .actions
                      .iter()
                      .enumerate()
                      .map(|(index, action)| compile_action(action, macro_action_key(&rule.id, false, index)))
                      .collect(),
          '@.TrimEnd()
          if (-not $s.Contains($old)) { throw 'legacy mouse-move compile mapper not found' }
          Set-Content $p ($s.Replace($old, $new)) -NoNewline

          $p = 'package.json'; $s = Get-Content $p -Raw; Set-Content $p ($s.Replace('"version": "0.3.0"','"version": "0.3.1"')) -NoNewline
          $p = 'src-tauri/Cargo.toml'; $s = Get-Content $p -Raw; Set-Content $p ($s.Replace('version = "0.3.0"','version = "0.3.1"')) -NoNewline
          $p = 'src-tauri/tauri.conf.json'; $s = Get-Content $p -Raw; Set-Content $p ($s.Replace('"version": "0.3.0"','"version": "0.3.1"')) -NoNewline
          $p = 'src/app/App.tsx'; $s = Get-Content $p -Raw; Set-Content $p ($s.Replace('const PROFILE_SCHEMA_VERSION = 1','const PROFILE_SCHEMA_VERSION = 3')) -NoNewline
      - run: pnpm install --frozen-lockfile
      - name: Frontend build
        run: pnpm build
      - name: Rust check
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Commit validated checkpoint
        shell: pwsh
        run: |
          Get-ChildItem .github/workflows -Filter 'v031-*.yml' -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem scripts -Filter 'v031*.py' -ErrorAction SilentlyContinue | Remove-Item -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(0.3.1): complete mouse triggers and macro playback"
          git pull --rebase origin dev/v0.3.1-mouse-macros
          git push origin HEAD:dev/v0.3.1-mouse-macros
