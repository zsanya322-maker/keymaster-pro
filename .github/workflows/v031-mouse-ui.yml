name: v0.3.1 Compact Mouse UI

on:
  push:
    branches:
      - dev/v0.3.1-mouse-macros
    paths:
      - '.github/workflows/v031-mouse-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
      - name: Apply staged UI patch
        run: python scripts/v031_mouse_ui.py
      - name: Commit UI integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/RulesPage.tsx src/i18n/locales/ru.json src/i18n/locales/en.json
          git commit -m 'feat(0.3.1): add compact mouse trigger editor'
          git push origin HEAD:dev/v0.3.1-mouse-macros
