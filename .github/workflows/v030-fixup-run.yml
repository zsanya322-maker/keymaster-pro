name: v0.3.0 Fixup Run

on:
  push:
    branches:
      - dev/v0.3.0-rule-model-v2

permissions:
  contents: write

concurrency:
  group: v030-fixup-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v030-fixup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compatibility fixup
        run: python scripts/v030_fixup.py

      - name: Commit generated fixups
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri
          git commit -m "fix(0.3.0): complete schema v2 compatibility [v030-fixup-applied]"
          git push origin HEAD:dev/v0.3.0-rule-model-v2
