name: v0.3.1 Compact Macro UI

on:
  push:
    branches:
      - dev/v0.3.1-mouse-macros
    paths:
      - '.github/workflows/v031-macro-compact-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
      - run: python scripts/v031_macro_compact_ui.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ruleBuilder/ActionEditor.tsx src/components/ruleBuilder/MacroEditor.tsx src/pages/SettingsPage.tsx src/i18n/locales/ru.json src/i18n/locales/en.json
          git commit -m 'feat(0.3.1): add compact macro playback controls'
          git push origin HEAD:dev/v0.3.1-mouse-macros
