name: v0.3.0 Core Apply

on:
  push:
    branches:
      - dev/v0.3.0-rule-model-v2

permissions:
  contents: write

concurrency:
  group: v030-core-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v030-core-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply core migration
        run: python scripts/apply_v030_core.py

      - name: Commit generated core changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "feat(0.3.0): wire chord runtime and schema migration [v030-core-applied]"
          git push origin HEAD:dev/v0.3.0-rule-model-v2
