name: v0.3.2 Complete

on:
  push:
    branches:
      - dev/v0.3.2-profiles-context
    paths:
      - .github/workflows/v032-complete.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  complete:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/v0.3.2-profiles-context
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Recover v0.3.2 staging scripts
        shell: pwsh
        run: |
          git show 163f5179d3a9576f8057ed1ef77c932ef41e97bf:scripts/v032_profiles_context.py | Out-File -Encoding utf8 scripts\v032_profiles_context.py
          git show 163f5179d3a9576f8057ed1ef77c932ef41e97bf:scripts/v032_frontend_fix.py | Out-File -Encoding utf8 scripts\v032_frontend_fix.py
          git show 163f5179d3a9576f8057ed1ef77c932ef41e97bf:scripts/v032_rust_fix.py | Out-File -Encoding utf8 scripts\v032_rust_fix.py

      - name: Apply complete v0.3.2 implementation
        run: |
          python scripts/v032_profiles_context.py
          python scripts/v032_frontend_fix.py
          python scripts/v032_rust_fix.py
          python scripts/v032_current_fix.py

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm build

      - name: Rust check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Build NSIS
        run: pnpm tauri build --bundles nsis

      - name: Commit validated complete v0.3.2
        shell: pwsh
        run: |
          git config user.name "AlexB322"
          git config user.email "264132173+zsanya322-maker@users.noreply.github.com"
          git rm -r -f scripts
          git rm -f .github/workflows/v032-complete.yml
          if (Test-Path .github/workflows/v032-finalize.yml) { git rm -f .github/workflows/v032-finalize.yml }
          if (Test-Path .github/workflows/v032-rust-diagnostics.yml) { git rm -f .github/workflows/v032-rust-diagnostics.yml }
          if (Test-Path .github/workflows/v032-rust-diagnostics-lite.yml) { git rm -f .github/workflows/v032-rust-diagnostics-lite.yml }
          git add -A
          git commit -m "feat(0.3.2): complete profiles auto-switch and rich context"
          git push origin HEAD:dev/v0.3.2-profiles-context

      - name: Upload v0.3.2 NSIS
        uses: actions/upload-artifact@v4
        with:
          name: KeyMaster-Pro-v0.3.2-Windows
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
