name: v0.3.1 Rule Tree Trigger Fix

on:
  push:
    branches:
      - dev/v0.3.1-mouse-macros
    paths:
      - '.github/workflows/v031-rule-tree-trigger-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
      - run: python scripts/v031_rule_tree_trigger_fix.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/rules/RuleTreePanel.tsx
          git commit -m 'fix(0.3.1): render new mouse triggers in rule tree'
          git push origin HEAD:dev/v0.3.1-mouse-macros
