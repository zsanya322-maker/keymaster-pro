name: v0.3.1 Package Fix

on:
  push:
    branches: [dev/v0.3.1-mouse-macros]
    paths: [.github/workflows/v031-package-fix.yml]

permissions:
  contents: write

jobs:
  validate-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1-mouse-macros
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Fix GetDoubleClickTime import
        shell: pwsh
        run: |
          $p='src-tauri/src/daemon/mouse_triggers.rs'
          $s=Get-Content $p -Raw
          $old=@'
              use windows::Win32::UI::WindowsAndMessaging::{
                  GetDoubleClickTime, GetSystemMetrics, SM_CXDOUBLECLK, SM_CYDOUBLECLK,
              };
          '@.Trim()
          $new=@'
              use windows::Win32::UI::Input::KeyboardAndMouse::GetDoubleClickTime;
              use windows::Win32::UI::WindowsAndMessaging::{
                  GetSystemMetrics, SM_CXDOUBLECLK, SM_CYDOUBLECLK,
              };
          '@.Trim()
          if (-not $s.Contains($old)) { throw 'GetDoubleClickTime legacy import not found' }
          Set-Content $p ($s.Replace($old,$new)) -NoNewline
      - run: pnpm install --frozen-lockfile
      - name: Frontend build
        run: pnpm build
      - name: Rust check
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Build NSIS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: KeyMaster-Pro-v0.3.1-Windows
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
      - name: Commit fix and cleanup
        shell: pwsh
        run: |
          Remove-Item .github/workflows/v031-package-fix.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(0.3.1): use correct Win32 double-click API import"
          git push origin HEAD:dev/v0.3.1-mouse-macros
