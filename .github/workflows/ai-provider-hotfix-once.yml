name: AI Provider Hotfix Once

on:
  push:
    branches:
      - agent/ai-provider-profiles-hotfix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-provider-profiles-hotfix
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Apply AI provider hotfix
        run: python scripts/apply-ai-provider-hotfix.py

      - name: Format and validate
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          Push-Location src-tauri
          cargo fmt --all
          cargo check --all-targets --locked
          cargo test --locked
          Pop-Location

      - name: Commit hotfix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "fix: persist AI provider profiles and composer state"
          git fetch origin agent/ai-provider-profiles-hotfix
          git rebase origin/agent/ai-provider-profiles-hotfix
          git push origin HEAD:agent/ai-provider-profiles-hotfix
