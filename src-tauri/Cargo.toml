[package]
name = "keymaster-pro"
version = "0.1.6"
description = "KeyMaster Pro — Desktop Keyboard Automation Utility"
authors = ["KeyMaster Pro Team"]
edition = "2024"

[lib]
name = "keymaster_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# GUI
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI args (--daemon flag)
clap = { version = "4", features = ["derive"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Regex (Layer Window Title matching)
regex = "1"

# Logging facade
log = "0.4"

# Windows API для keyboard/mouse hooks, Named Pipes, security
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
] }

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
